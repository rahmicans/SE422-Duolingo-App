<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SE 422 Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="/static/stil.css">
<script>
  // Sayfa çizilmeden önce kayıtlı temayı uygula (yanıp sönmeyi önler)
  try {
    var t = (JSON.parse(localStorage.getItem("se422-ders-v1") || "{}").tema) || "sistem";
    if (t !== "sistem") document.documentElement.dataset.theme = t === "koyu" ? "dark" : "light";
  } catch (e) {}
</script>
</head>
<body>
<div class="uygulama">
  <nav class="yan-menu" id="yan-menu"></nav>
  <main class="orta">
    <div class="mobil-ust" id="mobil-ust"></div>
    <div id="sayfa"></div>
  </main>
  <aside class="sag-panel" id="sag-panel"></aside>
</div>
<nav class="alt-menu" id="alt-menu"></nav>

<div id="ders-katman"></div>

<aside class="terminal" id="terminal" aria-label="Python terminali">
  <div class="terminal-ust">
    <span class="t-baslik"><span class="nokta" id="t-nokta"></span>Python + NumPy + pandas</span>
    <div class="t-pencere">
      <button id="t-tam" title="Tam ekran" aria-label="Tam ekran" aria-pressed="false">⛶</button>
      <button id="terminal-kapat" title="Kapat (Esc)" aria-label="Kapat">✕</button>
    </div>
  </div>
  <div class="t-arac" role="toolbar" aria-label="Terminal araçları">
    <button id="t-calistir" class="t-ana" title="Çalıştır (Ctrl/⌘ + Enter)">▶ Çalıştır <kbd>⌘↵</kbd></button>
    <button id="t-durdur" disabled title="Çalışan kodu durdur">■ Durdur</button>
    <button id="t-temizle" title="Çıktıyı temizle">Temizle</button>
    <button id="t-kod-sifirla" title="Kodu slayttaki orijinal haline döndür">↺ Kodu sıfırla</button>
    <button id="t-kopyala" title="Çıktıyı panoya kopyala">⧉ Kopyala</button>
    <button id="terminal-sifirla" title="Tüm değişkenleri sil">Oturumu sıfırla</button>
  </div>
  <div class="t-govde" id="t-govde">
    <div class="t-editor" id="t-editor"></div>
    <div class="t-ayirici" id="t-ayirici" role="separator" aria-orientation="horizontal" aria-label="Editör ve çıktı arasındaki ayırıcı" tabindex="0"></div>
    <div class="t-cikti-kap">
      <div class="t-durum-satir"><span id="t-durum" class="t-durum">Hazır</span><span id="t-sure" class="t-sure"></span></div>
      <div class="terminal-ekran" id="terminal-ekran" tabindex="0"><div class="t-bilgi">NumPy (np) ve pandas (pd) hazır yüklü. Değişkenler çalıştırmalar arasında korunur.
Ctrl/⌘ + Enter: çalıştır · Tab: 4 boşluk · Shift + Tab: girintiyi azalt · Esc: kapat</div></div>
    </div>
  </div>
</aside>
